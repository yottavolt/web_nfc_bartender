<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cocktail HMI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- Burger -->
  <button id="burger" class="burger"><span></span><span></span><span></span></button>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <nav>
      <button class="tab-link active" data-target="tab-drinks">Drinks</button>
      <button class="tab-link" data-target="tab-status">Status</button>
      <button class="tab-link" data-target="tab-config">Config</button>
    </nav>
  </aside>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Content -->
  <main class="content">
    <!-- Drinks -->
    <section id="tab-drinks" class="tab active">
      <div id="drinksGrid" class="grid"></div>
    </section>

    <!-- Status -->
    <section id="tab-status" class="tab">
      <div id="statusBars" class="bars"></div>
    </section>

    <!-- Config -->
    <section id="tab-config" class="tab">
      <div class="config">
        <table class="ingredient-table">
          <tbody id="ingredientsConfig"></tbody>
        </table>
        <div class="form-row">
          <label>Password</label>
          <input id="cfgPassword" type="password"/>
        </div>
        <button id="btnWrite" class="btn">Write NFC</button>
        <pre id="writeOutput"></pre>
        <button id="btnTestnfc" class="btn">Test NFC</button>
        <pre id="Testnfcoutput"></pre>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>


<script>
  window.addEventListener('load', () => {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/eruda';
    document.body.appendChild(script);
    script.onload = () => eruda.init();
  });
</script>


<button id="testNFC">Test NFC</button>
<script>
  document.getElementById('testNFC').addEventListener('click', async () => {
    if ('NDEFWriter' in window) {
      try {
        const ndef = new NDEFWriter();
        await ndef.write("Test NFC payload");
        alert("✅ NFC write successful!");
      } catch (err) {
        alert("❌ NFC write failed: " + err.message);
      }
    } else {
      alert("⚠️ Web NFC not supported.");
    }
  });
</script>
