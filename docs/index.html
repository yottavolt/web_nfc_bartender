<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark NFC Webpage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <button id="burger">&#9776;</button>
    <nav id="navMenu" class="hidden">
      <button onclick="showTab('home')">Home</button>
      <button onclick="showTab('status')">Status</button>
      <button onclick="showTab('config')">Config</button>
    </nav>
  </header>

  <main>
    <section id="home" class="tab active">
      <h1>Welcome Home</h1>
      <p>This is the home tab.</p>
    </section>

    <section id="status" class="tab">
      <h1>Status</h1>
      <p>System status info goes here.</p>
    </section>

    <section id="config" class="tab">
      <h1>Configuration</h1>
      <p>Write to NFC tag:</p>
      <input type="text" id="nfcText" placeholder="Enter text to write" />
      <button onclick="writeToNFC()">Write to NFC</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
