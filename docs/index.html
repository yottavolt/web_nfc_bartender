<!DOCTYPE html>
<html>
  <head><title>Web NFC Testyy</title></head>
  <body>
    <button id="nfcBtn">Write NFC</button>
    <script>
      document.getElementById("nfcBtn").addEventListener("click", async () => {
        const text = "Hello NFC!";
        if ("NDEFWriter" in window) {
          try {
            const writer = new NDEFWriter();
            alert("Approach your NFC tag now...");
            await writer.write({ records: [{ recordType: "text", data: text }] });
            alert("Tag written successfully!");
          } catch (err) {
            alert("Write failed: " + err.message);
          }
        } else {
          try {
            await navigator.clipboard.writeText(text);
            alert("Web NFC not supported. Text copied to clipboard.");
          } catch (err) {
            alert("Clipboard failed. Please copy manually: " + text);
          }
        }
      });
    </script>
  </body>
</html>
