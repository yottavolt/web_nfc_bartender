<!DOCTYPE html>
<html>
  <head><title>Web NFC Test</title></head>
  <body>
    <button onclick="writeNFC()">Write NFC</button>
    <script>
      async function writeNFC() {
        const text = "Hello NFC!";
        if ("NDEFWriter" in window) {
          try {
            const writer = new NDEFWriter();
            alert("Approach tag...");
            await writer.write({ records: [{ recordType: "text", data: text }] });
            alert("Success!");
          } catch (err) {
            alert("Error: " + err);
          }
        } else {
          await navigator.clipboard.writeText(text);
          alert("Web NFC not supported. Text copied.");
        }
      }
    </script>
  </body>
</html>
