<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Temperature Dashboard</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Hamburger -->
  <button id="menu-toggle" class="hamburger" aria-label="Open menu">&#9776;</button>

  <!-- Sidebar -->
  <aside id="sidebar" aria-label="Sidebar navigation">
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('status')">Status</button>
  </aside>

 <!-- Modal -->
<div id="nfcModal" class="modal hidden">
  <div class="modal-content">
    <p id="nfcMessage">Hold your phone near the NFC tag...</p>
    <button id="copyBtn" class="hidden">📋 Copy to Clipboard</button>
    <button id="copyFallbackBtn" class="hidden">📋 Copy to Clipboard</button>
  </div>
</div>

  <!-- Pages -->
<div id="home" class="section active" style="text-align:center">
    <br>
    <br>
    <button id="test3Btn">Write Temp to NFC111</button>
</div>

<div id="status" class="section">
    <div class="form-grid" id="formContainer" style="margin-top: 4rem;"></div>
    <div style="text-align:center">
      <h1>blalabla</h1>
    </div>
</div>


</body>
<script src="script.js" defer></script>
</html>

<script src="https://unpkg.com/eruda"></script>
<script>eruda.init();</script>
